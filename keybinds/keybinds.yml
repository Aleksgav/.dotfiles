# Keybindings cheatsheet, shown in fzf by ./keybinds (mango: Super + Alt + k).
# Hand-maintained: extracted from mango/config.conf, zellij/config.kdl,
# alacritty/alacritty.toml, nvim (own maps + LazyVim), zsh, cmus, yazi, lazygit, btop and fzf defaults.
# Update when those change.
#
# Format: list of sections { name, prefix (optional, shown as "<prefix> ; <key>"), keybinds: [{ name, key }] }.
# Notation: {a, b} = one key per item in the name ("left / right" -> {h, l});
#           "or" = alternative keys for the same action.
# Rows are listed in file order; a search ranks matches, ties keep file order.

# ---------------------------------------------------------------- mango

- name: "mango: apps"
  keybinds:
    - name: "App launcher (tofi)"
      key: "Alt + Space"
    - name: "App launcher (fuzzel)"
      key: "Alt + Shift + Space"
    - name: "Terminal (alacritty)"
      key: "Alt + Return  or  Super + Shift + Return"
    - name: "Terminal with zellij"
      key: "Super + Shift + Alt + Return"
    - name: "Google Chrome"
      key: "Super + Shift + c"
    - name: "Emacs (client)"
      key: "Super + Shift + e"
    - name: "Thunar"
      key: "Super + Shift + f"
    - name: "Yazi"
      key: "Super + Shift + y"
    - name: "btop"
      key: "Super + b"
    - name: "pavucontrol"
      key: "Super + v"

- name: "mango: scratchpads"
  keybinds:
    - name: "Toggle info.md (glow)"
      key: "Super + Alt + i"
    - name: "Toggle notes ~/xnotes (glow)"
      key: "Super + Alt + s"
    - name: "Toggle nmtui (network)"
      key: "Super + Alt + n"
    - name: "Toggle alsamixer (volume)"
      key: "Super + Alt + v"
    - name: "Toggle cmus (music)"
      key: "Super + Alt + x"
    - name: "Toggle keybindings cheatsheet (fzf)"
      key: "Super + Alt + k"
    - name: "Toggle todo.txt (tuxedo)"
      key: "Super + Alt + t"

- name: "mango: system"
  keybinds:
    - name: "Reload mango config"
      key: "Super + Shift + r"
    - name: "Log out (uwsm stop)"
      key: "Super + Shift + x"
    - name: "Lock screen (hyprlock)"
      key: "Super + Ctrl + l"
    - name: "Notification center (swaync)"
      key: "Super + n"
    - name: "Toggle do-not-disturb"
      key: "Super + Shift + n"
    - name: "Screenshot region -> satty"
      key: "Super + Shift + p"
    - name: "Screenshot full screen -> satty"
      key: "Super + Print"
    - name: "Switch keyboard layout (us / ru)"
      key: "Super + Space"

- name: "mango: windows"
  keybinds:
    - name: "Focus next / prev in stack"
      key: "Super + {j, k}  or  Super + {Down, Up}"
    - name: "Focus window left / right"
      key: "Super + {h, l}"
    - name: "Swap window left / down / up / right"
      key: "Super + Shift + {h, j, k, l}  or  Super + Shift + arrows"
    - name: "Promote to master"
      key: "Super + Return"
    - name: "Close window"
      key: "Super + Shift + q"
    - name: "Move window 50px"
      key: "Ctrl + Shift + arrows"
    - name: "Resize window 50px"
      key: "Ctrl + Alt + arrows"

- name: "mango: window state"
  keybinds:
    - name: "Fullscreen"
      key: "Super + f"
    - name: "Maximize"
      key: "Alt + f"
    - name: "Fake fullscreen"
      key: "Alt + Shift + f"
    - name: "Floating"
      key: "Super + Ctrl + f"
    - name: "Global (show on every tag)"
      key: "Super + g"
    - name: "Overlay (keep on top)"
      key: "Super + o"
    - name: "Minimize"
      key: "Super + i"
    - name: "Restore minimized"
      key: "Super + Shift + i"
    - name: "Overview"
      key: "Super + Tab"

- name: "mango: layouts"
  keybinds:
    - name: "Cycle layouts"
      key: "Super + Ctrl + k"
    - name: "tile"
      key: "Super + Ctrl + q"
    - name: "grid"
      key: "Super + Ctrl + w"
    - name: "deck"
      key: "Super + Ctrl + e"
    - name: "center_tile"
      key: "Super + Ctrl + r"
    - name: "right_tile"
      key: "Super + Ctrl + t"
    - name: "dwindle"
      key: "Super + Ctrl + y"
    - name: "fair"
      key: "Super + Ctrl + u"
    - name: "Scroller: full-width window"
      key: "Alt + e"
    - name: "Scroller: cycle width preset (0.5 / 0.8 / 1.0)"
      key: "Alt + x"
    - name: "Scroller: stack window toward direction"
      key: "Ctrl + Super + Alt + arrows"
    - name: "Dwindle: toggle split direction"
      key: "Alt + Shift + Return"
    - name: "Gaps bigger / smaller"
      key: "Alt + Shift + {x, z}"
    - name: "Toggle gaps"
      key: "Alt + Shift + r"

- name: "mango: tags & monitors"
  keybinds:
    - name: "View tag 1-9"
      key: "Super + {1..9}"
    - name: "Move window to tag and follow"
      key: "Super + Shift + {1..9}"
    - name: "Move window to tag silently"
      key: "Super + Alt + {1..9}"
    - name: "Prev / next tag"
      key: "Super + {Left, Right}"
    - name: "Prev / next tag with windows"
      key: "Ctrl + {Left, Right}"
    - name: "Move window to prev / next tag"
      key: "Ctrl + Super + {Left, Right}"
    - name: "Focus monitor left / right"
      key: "Super + Alt + {h, l}  or  Super + Alt + {Left, Right}"
    - name: "Send window to monitor left / right"
      key: "Alt + Shift + {h, l}  or  Alt + Shift + {Left, Right}"

- name: "mango: mouse & gestures"
  keybinds:
    - name: "Move window"
      key: "Super + left-drag"
    - name: "Resize window"
      key: "Super + right-drag"
    - name: "Toggle maximize"
      key: "Middle click"
    - name: "Prev / next tag with windows"
      key: "Super + scroll {up, down}"
    - name: "Focus window left / right"
      key: "3-finger swipe {left, right}"
    - name: "Prev / next tag with windows"
      key: "4-finger swipe {left, right}"
    - name: "Overview"
      key: "4-finger swipe up or down"

# ---------------------------------------------------------------- zellij
# Effective bindings = zellij 0.45.1 defaults (no clear-defaults) + zellij/config.kdl.
# Default "Alt f" (toggle floating panes) is omitted: mango grabs Alt + f.

- name: "zellij"
  keybinds:
    - name: "Lock / unlock (pass keys through)"
      key: "Alt + g"
    - name: "Quit"
      key: "Ctrl + q"
    - name: "New pane"
      key: "Alt + n"
    - name: "Close pane"
      key: "Alt + w"
    - name: "Toggle pane fullscreen"
      key: "Alt + z"
    - name: "New tab"
      key: "Alt + t"
    - name: "Focus pane or tab left / right"
      key: "Alt + {h, l}  or  Alt + {Left, Right}"
    - name: "Focus pane down / up"
      key: "Alt + {j, k}  or  Alt + {Down, Up}"
    - name: "Grow / shrink pane"
      key: "Alt + {=, -}  or  Alt + +"
    - name: "Prev / next swap layout"
      key: "Alt + {[, ]}"
    - name: "Move tab left / right"
      key: "Alt + {i, o}"
    - name: "Toggle pane in group"
      key: "Alt + p"
    - name: "Toggle group marking"
      key: "Alt + Shift + p"
    - name: "fzf -> open file in $EDITOR"
      key: "Alt + m"
    - name: "Harpoon plugin"
      key: "Ctrl + y"
    - name: "Back to normal mode"
      key: "Enter  or  Esc"

- name: "zellij: modes"
  keybinds:
    - name: "Pane mode"
      key: "Ctrl + p"
    - name: "Tab mode"
      key: "Ctrl + t"
    - name: "Resize mode"
      key: "Ctrl + n"
    - name: "Move mode"
      key: "Ctrl + h"
    - name: "Scroll mode"
      key: "Ctrl + s"
    - name: "Session mode"
      key: "Ctrl + o"
    - name: "Tmux mode"
      key: "Ctrl + a  or  Ctrl + b"

- name: "zellij: pane"
  prefix: "Ctrl + p"
  keybinds:
    - name: "Move focus"
      key: "{h, j, k, l}  or  arrows"
    - name: "Focus next pane"
      key: "p"
    - name: "Focus last pane"
      key: ";"
    - name: "New pane"
      key: "n"
    - name: "New pane down / right"
      key: "{d, r}"
    - name: "New stacked pane"
      key: "s"
    - name: "Close pane"
      key: "x"
    - name: "Fullscreen"
      key: "f"
    - name: "Fullscreen without UI"
      key: "Shift + f"
    - name: "Toggle pane frames"
      key: "z"
    - name: "Toggle floating panes"
      key: "w"
    - name: "Embed / float pane"
      key: "e"
    - name: "Pin floating pane"
      key: "i"
    - name: "Rename pane"
      key: "c"

- name: "zellij: tab"
  prefix: "Ctrl + t"
  keybinds:
    - name: "Prev tab"
      key: "h  or  k  or  Left  or  Up"
    - name: "Next tab"
      key: "l  or  j  or  Right  or  Down"
    - name: "Go to tab 1-9"
      key: "{1..9}"
    - name: "Last tab"
      key: "Tab"
    - name: "New tab"
      key: "n"
    - name: "Close tab"
      key: "x"
    - name: "Rename tab"
      key: "r"
    - name: "Sync input to all panes"
      key: "s"
    - name: "Break pane into new tab"
      key: "b"
    - name: "Break pane to tab left / right"
      key: "{[, ]}"

- name: "zellij: resize"
  prefix: "Ctrl + n"
  keybinds:
    - name: "Grow left / down / up / right"
      key: "{h, j, k, l}  or  arrows"
    - name: "Shrink left / down / up / right"
      key: "{H, J, K, L}"
    - name: "Grow"
      key: "=  or  +"
    - name: "Shrink"
      key: "-"

- name: "zellij: move"
  prefix: "Ctrl + h"
  keybinds:
    - name: "Move pane forward"
      key: "n  or  Tab"
    - name: "Move pane backward"
      key: "p"
    - name: "Move pane left / down / up / right"
      key: "{h, j, k, l}  or  arrows"

- name: "zellij: scroll & search"
  prefix: "Ctrl + s"
  keybinds:
    - name: "Scroll down / up"
      key: "{j, k}  or  {Down, Up}"
    - name: "Page down"
      key: "Ctrl + f  or  PageDown  or  l  or  Right"
    - name: "Page up"
      key: "Ctrl + b  or  PageUp  or  h  or  Left"
    - name: "Half page down / up"
      key: "{d, u}"
    - name: "Prev / next shell prompt"
      key: "{[, ]}"
    - name: "Select command at scroll position"
      key: "m"
    - name: "Copy last command output"
      key: "c"
    - name: "Edit scrollback in nvim"
      key: "e"
    - name: "Search (type, then Enter)"
      key: "s"
    - name: "Search: next / prev match"
      key: "{n, p}"
    - name: "Search: toggle case / wrap / whole word"
      key: "{c, w, o}"
    - name: "Scroll to bottom and exit"
      key: "Ctrl + c"

- name: "zellij: session"
  prefix: "Ctrl + o"
  keybinds:
    - name: "Detach"
      key: "d"
    - name: "Session manager"
      key: "w"
    - name: "Layout manager"
      key: "l"
    - name: "Configuration"
      key: "c"
    - name: "Plugin manager"
      key: "p"
    - name: "Share session"
      key: "s"
    - name: "About"
      key: "a"
    - name: "Focus host / guest session"
      key: "{], [}"
    - name: "Toggle host fullscreen"
      key: "f"

- name: "zellij: tmux"
  prefix: "Ctrl + a"
  keybinds:
    - name: "Split pane down"
      key: "-  or  \""
    - name: "Split pane right"
      key: "|  or  %"
    - name: "New tab"
      key: "c"
    - name: "Rename tab"
      key: ","
    - name: "Prev / next tab"
      key: "{p, n}"
    - name: "Move focus (stays in tmux mode)"
      key: "{h, j, k, l}  or  arrows"
    - name: "Focus next pane"
      key: "o"
    - name: "Toggle fullscreen"
      key: "z"
    - name: "Close pane"
      key: "x"
    - name: "Next swap layout"
      key: "Space"
    - name: "Scroll mode"
      key: "["
    - name: "Detach"
      key: "d"
    - name: "Send Ctrl+b to the app"
      key: "Ctrl + a  or  Ctrl + b"

# ---------------------------------------------------------------- alacritty
# Linux bindings only; the "macOS only" (Command) block is left out.
# "Alt + Return" (ToggleFullscreen) is omitted: mango grabs it to spawn alacritty.

- name: "alacritty"
  keybinds:
    - name: "Copy / paste"
      key: "Ctrl + Shift + {c, v}"
    - name: "Paste primary selection"
      key: "Shift + Insert  or  Middle click"
    - name: "Search forward / backward"
      key: "Ctrl + Shift + {f, b}"
    - name: "Open URL (hint labels)"
      key: "Ctrl + Shift + u"
    - name: "Open URL under mouse"
      key: "Click"
    - name: "Expand selection"
      key: "Right click"
    - name: "Toggle vi mode"
      key: "Ctrl + Shift + Space"
    - name: "Scroll page up / down"
      key: "Shift + {PageUp, PageDown}"
    - name: "Scroll to top / bottom"
      key: "Shift + {Home, End}"
    - name: "Clear screen"
      key: "Ctrl + l"
    - name: "Font size reset"
      key: "Ctrl + 0"
    - name: "Font size bigger / smaller"
      key: "Ctrl + {=, -}  or  Ctrl + +"

- name: "alacritty: vi mode"
  keybinds:
    - name: "Exit vi mode"
      key: "i  or  Ctrl + c  or  Ctrl + Shift + Space"
    - name: "Move"
      key: "{h, j, k, l}  or  arrows"
    - name: "Line start / end / first non-blank"
      key: "{0, $, ^}"
    - name: "Screen top / middle / bottom"
      key: "{H, M, L}"
    - name: "Semantic word back / fwd / end"
      key: "{b, w, e}"
    - name: "WORD back / fwd / end"
      key: "{B, W, E}"
    - name: "Matching bracket"
      key: "%"
    - name: "History top / bottom"
      key: "{g, G}"
    - name: "Scroll line up / down"
      key: "Ctrl + {y, e}"
    - name: "Scroll page up / down"
      key: "Ctrl + {b, f}"
    - name: "Scroll half page up / down"
      key: "Ctrl + {u, d}"
    - name: "Center on cursor"
      key: "z"
    - name: "Select char / line / block / semantic"
      key: "v  or  V  or  Ctrl + v  or  Alt + v"
    - name: "Yank selection"
      key: "y"
    - name: "Clear selection"
      key: "Esc"
    - name: "Open URL at cursor"
      key: "Enter"
    - name: "Search forward / backward"
      key: "{/, ?}"
    - name: "Next / prev match"
      key: "{n, N}"

- name: "alacritty: search"
  keybinds:
    - name: "Confirm"
      key: "Enter"
    - name: "Cancel"
      key: "Esc  or  Ctrl + c"
    - name: "Next / prev match"
      key: "Enter  /  Shift + Enter"
    - name: "Clear input"
      key: "Ctrl + u"
    - name: "Delete word"
      key: "Ctrl + w"
    - name: "History prev / next"
      key: "Ctrl + {p, n}  or  {Up, Down}"

# ---------------------------------------------------------------- btop
# btop 1.4.7 built-in keys (help_text in src/btop_menu.cpp @ v1.4.7); vim_keys = false.

- name: "btop"
  keybinds:
    - name: "Main menu"
      key: "Esc  or  m"
    - name: "Options"
      key: "F2  or  o"
    - name: "Help"
      key: "F1  or  ?  or  h"
    - name: "Quit"
      key: "q  or  Ctrl + c"
    - name: "Next / prev layout preset"
      key: "p  /  Shift + p"
    - name: "Toggle CPU / MEM / NET / PROC / GPU box"
      key: "{1, 2, 3, 4, 5}"
    - name: "Toggle disks in MEM box"
      key: "d"
    - name: "Toggle disk IO mode (big graphs)"
      key: "i"
    - name: "Prev / next network device"
      key: "{b, n}"
    - name: "Net: reset totals / auto scale / synced scale"
      key: "{z, a, y}"
    - name: "Update interval +100ms / -100ms"
      key: "{+, -}"
    - name: "Reload config"
      key: "Ctrl + r"
    - name: "Suspend"
      key: "Ctrl + z"

- name: "btop: processes"
  keybinds:
    - name: "Select process"
      key: "{Up, Down}  or  click"
    - name: "Page up / down"
      key: "{PageUp, PageDown}"
    - name: "First / last page"
      key: "{Home, End}"
    - name: "Process details"
      key: "Enter"
    - name: "Filter (! = regex) / clear filter"
      key: "f  or  /  /  Delete"
    - name: "Prev / next sort column"
      key: "{Left, Right}"
    - name: "Reverse sort"
      key: "r"
    - name: "Follow selected process"
      key: "F"
    - name: "Pause process list"
      key: "u"
    - name: "Per-core CPU usage"
      key: "c"
    - name: "Memory display mode"
      key: "%"
    - name: "Tree view"
      key: "e"
    - name: "Tree: expand / collapse selected"
      key: "Space  or  {+, -}"
    - name: "Tree: expand / collapse children"
      key: "C"
    - name: "Tree: expand / collapse all"
      key: "E"
    - name: "Terminate (SIGTERM) / kill (SIGKILL)"
      key: "{t, k}"
    - name: "Send signal"
      key: "s"
    - name: "Set nice value"
      key: "N"

# ---------------------------------------------------------------- cmus
# cmus 2.12 defaults (no rc overrides; matches the bind lines in ~/.config/cmus/autosave).

- name: "cmus: playback"
  keybinds:
    - name: "Play / pause / stop"
      key: "{x, c, v}"
    - name: "Next / prev track"
      key: "{b, z}"
    - name: "Next / prev album"
      key: "{B, Z}"
    - name: "Seek -5s / +5s"
      key: "{h, l}  or  {Left, Right}"
    - name: "Seek -1 min"
      key: ","
    - name: "Seek +1 min"
      key: "."
    - name: "Volume +10%"
      key: "+  or  ="
    - name: "Volume -10%"
      key: "-"
    - name: "Left channel +1% / -1%"
      key: "[  /  {"
    - name: "Right channel +1% / -1%"
      key: "]  /  }"
    - name: "Status bar: pause / seek / volume"
      key: "Click  /  scroll  /  scroll right side"

- name: "cmus: toggles"
  keybinds:
    - name: "Shuffle"
      key: "s"
    - name: "Repeat"
      key: "r"
    - name: "Repeat current track"
      key: "Ctrl + r"
    - name: "Continue after track ends"
      key: "C"
    - name: "Follow playing track"
      key: "f"
    - name: "Play from library / playlist"
      key: "M"
    - name: "Play in sorted-view order"
      key: "o"
    - name: "Library scope (all / artist / album)"
      key: "m"
    - name: "Remaining / elapsed time"
      key: "t"

- name: "cmus: views & navigation"
  keybinds:
    - name: "Library tree / sorted / playlists / queue"
      key: "{1, 2, 3, 4}"
    - name: "File browser / filters / settings"
      key: "{5, 6, 7}"
    - name: "Switch tree / track pane (view 1)"
      key: "Tab"
    - name: "Down / up"
      key: "{j, k}  or  {Down, Up}  or  mouse scroll"
    - name: "Top / bottom"
      key: "{g, G}  or  {Home, End}"
    - name: "Page down / up"
      key: "Ctrl + {f, b}  or  {PageDown, PageUp}"
    - name: "Half page down / up"
      key: "Ctrl + {d, u}"
    - name: "Scroll line down / up"
      key: "Ctrl + {e, y}"
    - name: "Prev / next view"
      key: "Scroll on title bar"
    - name: "Redraw screen"
      key: "Ctrl + l"

- name: "cmus: tracks & library"
  keybinds:
    - name: "Play selected"
      key: "Enter  or  click selected"
    - name: "Mark track / expand album"
      key: "Space"
    - name: "Select current track"
      key: "i"
    - name: "Add to library"
      key: "a"
    - name: "Add to marked playlist"
      key: "y"
    - name: "Add to queue / prepend to queue"
      key: "{e, E}"
    - name: "Move marked after / before selected"
      key: "{p, P}"
    - name: "Remove"
      key: "D  or  Delete"
    - name: "Update metadata cache (all)"
      key: "u"
    - name: "Update metadata cache (selected)"
      key: "U"
    - name: "Show file path"
      key: "I"

- name: "cmus: search & commands"
  keybinds:
    - name: "Search forward / backward"
      key: "{/, ?}"
    - name: "Next / prev match"
      key: "{n, N}"
    - name: "Filter"
      key: "F"
    - name: "Live filter"
      key: "L"
    - name: "Command mode (e.g. :quit)"
      key: ":"
    - name: "Run shell command"
      key: "!"
    - name: "Quit (asks to confirm)"
      key: "q"

- name: "cmus: file browser (5)"
  keybinds:
    - name: "Play file / enter directory"
      key: "Space  or  Enter"
    - name: "Parent directory"
      key: "Backspace"
    - name: "Toggle hidden files"
      key: "i"
    - name: "Refresh"
      key: "u"

# ---------------------------------------------------------------- fzf
# fzf 0.74.5 defaults (no FZF_DEFAULT_OPTS / --bind; man fzf "AVAILABLE ACTIONS")
# + zsh widgets from `fzf --zsh` (loaded by sheldon and ~/.fzf.zsh).
# Tab is bound to forge-completion (forge init runs last in .zshrc) and falls back to
# plain zsh completion, so fzf's **<Tab> and fzf-tab are not active and not listed.
# * = zellij grabs this key in normal mode; press Alt + g (lock) first.
# Alt + f (forward word) omitted: mango grabs it.

- name: "fzf: shell (zsh)"
  keybinds:
    - name: "* = zellij grabs it; lock zellij first"
      key: "Alt + g"
    - name: "Insert files / dirs into command line"
      key: "Ctrl + t  *"
    - name: "Search command history"
      key: "Ctrl + r"
    - name: "History search: toggle sort / raw mode"
      key: "Ctrl + r  /  Alt + r"
    - name: "cd into a directory"
      key: "Alt + c"

- name: "fzf: finder"
  keybinds:
    - name: "Accept"
      key: "Enter  or  double-click"
    - name: "Abort"
      key: "Esc  or  Ctrl + c  or  Ctrl + g  or  Ctrl + q  *"
    - name: "Down / up"
      key: "Ctrl + {j, k}  or  {Down, Up}"
    - name: "Next / prev match"
      key: "Ctrl + {n, p}  *  or  Alt + {Down, Up}  *"
    - name: "Page down / up"
      key: "{PageDown, PageUp}"
    - name: "Mark and move down / up (multi-select)"
      key: "Tab  /  Shift + Tab"
    - name: "Mark item (multi-select)"
      key: "Right click"
    - name: "Scroll preview down / up"
