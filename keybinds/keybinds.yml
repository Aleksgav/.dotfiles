# ---------------------------------------------------------------- zsh
# Effective `bindkey -M viins/vicmd/viopp` of an interactive shell: oh-my-zsh vi-mode
# (main keymap = viins), oh-my-zsh key-bindings, fzf, zsh-autosuggestions, npm, forge.
# * = zellij grabs this key in normal mode; press Alt + g (lock) first.
# Ctrl + Left/Right (word motions) omitted: mango grabs them.

- name: "zsh: insert mode"
  keybinds:
    - name: "* = zellij grabs it; lock zellij first"
      key: "Alt + g"
    - name: "Normal (vi command) mode"
      key: "Esc"
    - name: "Line start / end"
      key: "{Home, End}  or  Ctrl + {a *, e}"
    - name: "Delete char before / under cursor"
      key: "Backspace  or  Ctrl + h  *  /  Delete"
    - name: "Delete word back / forward"
      key: "Ctrl + w  /  Ctrl + Delete"
    - name: "Delete back to where insert started"
      key: "Ctrl + u"
    - name: "Clear screen"
      key: "Ctrl + l"
    - name: "History up / down (prefix match)"
      key: "{Up, Down}"
    - name: "History up / down"
      key: "Ctrl + {p, n}  *  or  {PageUp, PageDown}"
    - name: "Search history (fzf)"
      key: "Ctrl + r"
    - name: "Incremental history search forward"
      key: "Ctrl + s  *"
    - name: "Insert file paths (fzf)"
      key: "Ctrl + t  *"
    - name: "cd into a directory (fzf)"
      key: "Alt + c"
    - name: "Accept autosuggestion"
      key: "Right  or  End  or  Ctrl + e"
    - name: "Complete / previous completion"
      key: "Tab  /  Shift + Tab"
    - name: "List completions / list expansion"
      key: "Ctrl + {d, g}"
    - name: "Complete word from history (newer / older)"
      key: "Alt + ,  /  Alt + /"
    - name: "Expand alias / completion help / newest file"
      key: "Ctrl + x {a, h, m}"
    - name: "Insert next key literally"
      key: "Ctrl + v  or  Ctrl + q  *"
    - name: "npm: toggle install / uninstall"
      key: "F2 F2"

- name: "zsh: normal mode"
  keybinds:
    - name: "Insert / append"
      key: "{i, a}"
    - name: "Insert at line start / append at end"
      key: "{I, A}"
    - name: "Open line below / above"
      key: "{o, O}"
    - name: "Char left / right"
      key: "{h, l}"
    - name: "Word fwd / back / end"
      key: "{w, b, e}  ({W, B, E} = WORD)"
    - name: "Word end backward"
      key: "g e  ({g E} = WORD)"
    - name: "Line start / first non-blank / end"
      key: "{0, ^, $}"
    - name: "Find char fwd / back, till fwd / back"
      key: "{f, F, t, T}"
    - name: "Repeat find / reverse"
      key: "{;, ,}"
    - name: "Matching bracket / go to column"
      key: "%  /  |"
    - name: "History down / up"
      key: "{j, k}  or  {+, -}"
    - name: "Search history back / fwd"
      key: "{/, ?}"
    - name: "Repeat search / reverse"
      key: "{n, N}"
    - name: "Oldest history / back to current line"
      key: "g g  /  G"
    - name: "Delete / change / yank (operator)"
      key: "{d, c, y}"
    - name: "Delete / change to end, yank line"
      key: "{D, C, Y}"
    - name: "Delete char under / before cursor"
      key: "{x, X}"
    - name: "Substitute char / whole line"
      key: "{s, S}"
    - name: "Replace char / replace mode"
      key: "{r, R}"
    - name: "Put after / before"
      key: "{p, P}"
    - name: "Undo / repeat last change"
      key: "u  /  ."
    - name: "Visual / visual line"
      key: "{v, V}"
    - name: "Edit command line in $EDITOR"
      key: "v v"
    - name: "Swap case / lower / upper (operator)"
      key: "~  /  g u  /  g U"
    - name: "Indent / unindent"
      key: "{>, <}"
    - name: "Join lines"
      key: "J"
    - name: "Comment out line and run it"
      key: "#"
    - name: "Set mark / go to mark (line)"
      key: "m  /  `  ( ' )"
    - name: "Use register for next yank / put"
      key: "\""
    - name: "Run zle widget by name"
      key: ":"
    - name: "Show char / cursor info"
      key: "g a"
    - name: "Textobjects: word / WORD / shell argument"
      key: "{a, i} {w, W, a}"
    - name: "Accept autosuggestion (all / next word)"
      key: "{l, $}  /  w"
    - name: "List completions"
      key: "=  or  Ctrl + d"

- name: "zsh: forge"
  keybinds:
    - name: "Send prompt to forge"
      key: ": <text>  Enter"
    - name: "Run forge command"
      key: ":<command> <text>  Enter"
    - name: "Pick a forge command"
      key: ":<partial>  Tab"
    - name: "Insert file reference"
      key: "@<partial>  Tab"

# ---------------------------------------------------------------- yazi
# yazi 26.9.1 defaults (no ~/.config/yazi; preset keymap-default.toml @ v26.9.1).
# Two-key chords are written "g h" (press g, then h).
# Input "Alt + f" and "Ctrl + Left/Right" (word motions) are omitted: mango grabs them.

- name: "yazi: navigation"
  keybinds:
    - name: "Next / prev file"
      key: "{j, k}  or  {Down, Up}"
    - name: "Parent / enter directory"
      key: "{h, l}  or  {Left, Right}"
    - name: "Back / forward in history"
      key: "{H, L}"
    - name: "Top / bottom"
      key: "{g g, G}  or  {Home, End}"
    - name: "Half page down / up"
      key: "Ctrl + {d, u}  or  Shift + {PageDown, PageUp}"
    - name: "Page down / up"
      key: "Ctrl + {f, b}  or  {PageDown, PageUp}"
    - name: "Scroll preview down / up"
      key: "{J, K}"
    - name: "Go home / ~/.config / ~/Downloads"
      key: "g {h, c, d}"
    - name: "Go to trash"
      key: "g t"
    - name: "Jump to path (prompt)"
      key: "g Space"
    - name: "Follow hovered symlink"
      key: "g f"
    - name: "Jump via fzf"
      key: "z"
    - name: "Jump via zoxide"
      key: "Z"

- name: "yazi: files"
  keybinds:
    - name: "Open"
      key: "o  or  Enter"
    - name: "Open with (pick opener)"
      key: "O  or  Shift + Enter"
    - name: "Yank (copy) / cut"
      key: "{y, x}"
    - name: "Paste / paste overwriting"
      key: "{p, P}"
    - name: "Cancel yank"
      key: "Y  or  X"
    - name: "Symlink yanked (absolute / relative)"
      key: "{-, _}"
    - name: "Hardlink yanked"
      key: "Ctrl + -"
    - name: "Trash / delete permanently"
      key: "{d, D}"
    - name: "Create (end with / for a dir)"
      key: "a"
    - name: "Bulk create"
      key: "A"
    - name: "Rename"
      key: "r"
    - name: "Shell command / blocking shell command"
      key: "{;, :}"
    - name: "Toggle hidden files"
      key: "."

- name: "yazi: select, search & copy"
  keybinds:
    - name: "Toggle selection (and move down)"
      key: "Space"
    - name: "Select all / invert selection"
      key: "Ctrl + {a, r}"
    - name: "Visual select / visual unselect"
      key: "{v, V}"
    - name: "Exit visual / clear selection / cancel search"
      key: "Esc"
    - name: "Search names (fd) / contents (rg)"
      key: "{s, S}"
    - name: "Cancel running search"
      key: "Ctrl + s"
    - name: "Filter"
      key: "f"
    - name: "Find next / prev"
      key: "{/, ?}"
    - name: "Next / prev found"
      key: "{n, N}"
    - name: "Copy path / dir path / filename / name w/o ext"
      key: "c {c, d, f, n}"
    - name: "Copy file URL / dir URL"
      key: "c {C, D}"

- name: "yazi: tabs, sort & linemode"
  keybinds:
    - name: "New tab in cwd"
      key: "t t"
    - name: "Rename tab"
      key: "t r"
    - name: "Switch to tab 1-9"
      key: "{1..9}"
    - name: "Prev / next tab"
      key: "{[, ]}"
    - name: "Swap tab with prev / next"
      key: "{{, }}"
    - name: "Close tab (quit if last)"
      key: "Ctrl + c"
    - name: "Sort: mtime / btime / ext / alpha / natural / size"
      key: ", {m, b, e, a, n, s}  (uppercase = reverse)"
    - name: "Sort randomly"
      key: ", r"
    - name: "Linemode: size / perms / btime / mtime / owner / none"
      key: "m {s, p, b, m, o, n}"

- name: "yazi: app & panels"
  keybinds:
    - name: "Quit / quit without cwd-file"
      key: "{q, Q}"
    - name: "Suspend"
      key: "Ctrl + z"
    - name: "Help"
      key: "~  or  F1"
    - name: "Spot (file info) open / close"
      key: "Tab"
    - name: "Spot: prev / next file"
      key: "{h, l}"
    - name: "Spot: copy cell"
      key: "c c"
    - name: "Task manager open / close"
      key: "w"
    - name: "Tasks: inspect / cancel"
      key: "{Enter, x}"
    - name: "Confirm: yes / no"
      key: "{y, n}"
    - name: "Completion: prev / next / accept"
      key: "Ctrl + {p, n}  /  Tab"

- name: "yazi: input prompt"
  keybinds:
    - name: "Submit / cancel"
      key: "Enter  /  Ctrl + c"
    - name: "Normal mode (Esc again cancels)"
      key: "Esc"
    - name: "Insert / append"
      key: "{i, a}"
    - name: "Insert at start / append at end"
      key: "{I, A}"
    - name: "Visual / select whole line"
      key: "{v, V}"
    - name: "Word back / fwd / end"
      key: "{b, w, e}  ({B, W, E} = WORD)"
    - name: "Line start / end"
      key: "{0, $}  or  Ctrl + {a, e}  or  {Home, End}"
    - name: "Word back (any mode)"
      key: "Alt + b"
    - name: "Kill to line start / line end"
      key: "Ctrl + {u, k}"
    - name: "Kill word back / fwd"
      key: "Ctrl + w  /  Alt + d"
    - name: "Cut / change / yank (visual)"
      key: "{d, c, y}"
    - name: "Paste after / before"
      key: "{p, P}"
    - name: "Undo / redo"
      key: "u  /  Ctrl + r"
    - name: "History prev / next"
      key: "{k, j}  or  Ctrl + {p, n}"
